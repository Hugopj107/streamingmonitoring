<!doctype html>
<meta charset="utf-8">
<title>Multi-court grid — beta</title>
<style>
  :root{--bg:#0b0e12;--panel:#12161c;--line:#20272f;--ink:#dfe6ee;--dim:#7d8a99;--accent:#4ec9b0;--warn:#ff2b3d;--check:#c58a1a;
    --mono:"SF Mono",ui-monospace,"Cascadia Code",Menlo,Consolas,monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:13px;padding:18px}
  h1{font-size:14px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 4px}
  .sub{color:var(--dim);font-size:11px;margin-bottom:14px}
  .bar{display:flex;gap:8px;margin-bottom:10px;align-items:center;flex-wrap:wrap}
  input{background:#0b0e12;border:1px solid var(--line);color:var(--ink);padding:7px 10px;border-radius:6px;font-family:var(--mono);font-size:12px}
  input:focus{outline:none;border-color:var(--accent)}
  button{background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:7px 12px;border-radius:6px;cursor:pointer;font-family:var(--mono);font-size:12px}
  button:hover{border-color:var(--accent)}
  button:disabled{opacity:.4;cursor:default}
  button:disabled:hover{border-color:var(--line)}
  .chip{color:var(--dim);font-size:11px}
  .chip.on{color:var(--accent)} .chip.err{color:var(--warn)}
  #nats-url{flex:1;min-width:220px}
  #roster{display:flex;flex-wrap:wrap;gap:6px 14px;margin:2px 0 16px;font-size:11px;color:var(--dim)}
  #roster .court{color:var(--ink)}
  #roster .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:5px}
  #roster .dot.stale{background:var(--line)}
  #nats-list .court{display:inline-flex;align-items:center;gap:7px;margin-right:8px;font-size:11px}
  #nats-list .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
  #nats-list .dot.stale{background:var(--line)}

  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
  .card-head{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .card-head input.cid{width:70px;text-align:center}
  .card-head input.url{flex:1;min-width:120px;font-size:11px}
  .card-label{font-size:11px;color:var(--dim);min-height:14px}
  .stage{position:relative;background:#000;border:2px solid var(--line);border-radius:8px;overflow:hidden;aspect-ratio:16/9}
  .stage.alert{border-color:var(--warn);box-shadow:inset 0 0 40px rgba(255,43,61,.5);animation:pulse .5s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
  canvas{width:100%;height:100%;display:block;object-fit:contain;background:#000}
  .stage .placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:11px;text-align:center;padding:10px}
  .hud{position:absolute;left:8px;top:8px;background:rgba(6,9,12,.8);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:10px}
  .hud .big{font-size:15px;font-weight:600}
  .st{margin-top:3px;padding:2px 6px;border-radius:4px;display:inline-block;font-size:9px;letter-spacing:.08em}
  .st.ok{background:rgba(78,201,176,.14);color:var(--accent)} .st.bad{background:rgba(255,43,61,.18);color:var(--warn)}
  .badges{display:flex;gap:6px;flex-wrap:wrap;font-size:10px}
  .badge{padding:2px 7px;border-radius:4px;font-weight:700}
  .pass{color:#04110d;background:var(--accent)} .check{color:#04110d;background:var(--check)} .fail{color:#fff;background:var(--warn)} .na{color:var(--dim);background:#20272f}
  .outlier{color:#04110d;background:var(--check);padding:2px 7px;border-radius:4px;font-weight:700}
  .card-foot{display:flex;justify-content:space-between;align-items:center}
  .rm{color:var(--dim);border:1px solid var(--line);background:none;padding:2px 8px;font-size:11px}
</style>

<h1>Multi-court grid — beta</h1>
<div class="sub">One direct SRT/RTSP ingest per court — real per-court frames + audio, no screen-share. Court→URL mapping is entered manually below; NATS (if connected) only supplies reference labels.</div>

<div class="bar">
  <input id="nats-url" placeholder="nats://…tournament-nats.tail….ts.net:4222" autocomplete="off">
  <button id="nats-connect">Add tournament</button>
  <span class="chip" id="nats-status">offline</span>
  <span id="nats-list"></span>
</div>
<div id="roster"></div>

<div class="bar">
  <button id="add-card">+ Add court</button>
  <span class="chip" id="ff"></span>
</div>

<div id="grid"></div>

<script src="qc.js"></script>
<script>
const PW=192, PH=108;   // detection resolution (matches ingest-test.html)
let lastRoster = [];
const cards = new Map();   // feedKey -> card

// ---------- NATS reference (labels only — SRT URLs are entered by hand) ----------
function deriveTName(u){ try{ const host=String(u).replace(/^nats:\/\//,'').split(':')[0].split('.')[0];
  return host.split('-court')[0].replace(/-nats$/,''); }catch(e){ return ''; } }
function renderRoster(list){
  lastRoster = list || [];
  const now = Date.now();
  document.getElementById('roster').innerHTML = lastRoster.map(c=>{
    const stale = now-c.lastSeen>10000, vs=(c.teamA||'?')+' vs '+(c.teamB||'?');
    return `<span class="court"><span class="dot ${stale?'stale':''}"></span>${deriveTName(c.url)} · Court ${c.courtId} — ${vs}</span>`;
  }).join('') || '<span style="color:var(--dim)">no tournaments connected — add one above, or leave courts unlabeled</span>';
  cards.forEach(updateCardLabel);
}
function renderServers(list){
  const el = document.getElementById('nats-list');
  el.innerHTML = (list||[]).map(sv=>`<span class="court"><span class="dot ${sv.connected?'':'stale'}"></span>${deriveTName(sv.url)}`
    + `<button data-url="${sv.url}" class="rm" style="padding:0 6px">×</button></span>`).join('');
  el.querySelectorAll('.rm').forEach(b=>b.onclick=async()=>{ await window.natsAPI.disconnect(b.dataset.url); renderServers(await window.natsAPI.servers()); });
}
function matchRoster(courtId){
  if(!courtId) return null;
  return lastRoster.find(c=>String(c.courtId)===String(courtId)) || null;
}
function updateCardLabel(card){
  const m = matchRoster(card.courtIdInput.value.trim());
  card.labelEl.textContent = m ? (deriveTName(m.url)+' · '+(m.teamA||'?')+' vs '+(m.teamB||'?')+(m.mId?(' · '+m.mId):'')) : '';
}
if(window.natsAPI){
  window.natsAPI.onUpdate(renderRoster);
  window.natsAPI.roster().then(renderRoster);
  window.natsAPI.servers().then(renderServers);
  const st=document.getElementById('nats-status'), url=document.getElementById('nats-url'), btn=document.getElementById('nats-connect');
  btn.onclick=async()=>{ const u=url.value.trim(); if(!u) return;
    st.textContent='connecting…'; st.className='chip';
    const res=await window.natsAPI.connect(u);
    if(res&&res.ok){ st.textContent='added'; st.className='chip on'; url.value=''; renderServers(await window.natsAPI.servers()); }
    else { st.textContent=(res&&res.error)||'failed'; st.className='chip err'; } };
} else {
  document.getElementById('nats-status').textContent='desktop app only';
  document.getElementById('nats-connect').disabled = true;
}

// ---------- ffmpeg probe ----------
if(window.ingestAPI){
  window.ingestAPI.probe().then(p=>{ const el=document.getElementById('ff');
    if(!p.ok){ el.textContent='⚠ '+p.error; el.style.color='var(--warn)'; }
    else { el.textContent='ffmpeg ok · SRT '+(p.srt?'✓':'✗')+' · RTSP '+(p.rtsp?'✓':'✗'); el.style.color=p.srt?'var(--accent)':'var(--check)'; } });
} else {
  document.getElementById('ff').textContent='desktop app only';
  document.getElementById('add-card').disabled = true;
}

// ---------- config persistence ----------
let saveTimer=null;
function saveConfig(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    if(!window.configStore) return;
    const courts=[...cards.values()].map(c=>({ courtId:c.courtIdInput.value.trim(), url:c.urlInput.value.trim() }));
    window.configStore.set({ ingestGrid:{ courts } });
  }, 400);
}

// ---------- per-card detection/audio/QC (ported from ingest-test.html, one instance per court) ----------
function addCard(initial){
  const feedKey = 'grid-' + Math.random().toString(36).slice(2, 9);
  const el = document.createElement('div'); el.className='card';
  el.innerHTML = `
    <div class="card-head">
      <input class="cid" placeholder="court" maxlength="8">
      <input class="url" placeholder="srt://host:port?passphrase=…  or  rtsp://…" autocomplete="off">
      <button class="start">Start</button>
      <button class="stop" disabled>Stop</button>
      <button class="rm">×</button>
    </div>
    <div class="card-label"></div>
    <div class="stage">
      <canvas width="384" height="216"></canvas>
      <div class="placeholder">not started</div>
      <div class="hud">
        <div class="chip">CHANGED</div>
        <div class="big"><span class="pct">0</span>%</div>
        <div class="st ok state">WAITING</div>
      </div>
    </div>
    <div class="badges">
      <span class="badge na exp-badge">EXP —</span>
      <span class="badge na wb-badge">WB —</span>
      <span class="badge na aud-badge">AUD —</span>
      <span class="outlier" style="display:none">⚠ OUTLIER</span>
    </div>
  `;
  document.getElementById('grid').appendChild(el);

  const off=document.createElement('canvas'); off.width=PW; off.height=PH;
  const ox=off.getContext('2d',{willReadFrequently:true});
  const cv=el.querySelector('canvas'), cx=cv.getContext('2d');

  const card = {
    feedKey, el,
    courtIdInput: el.querySelector('.cid'), urlInput: el.querySelector('.url'),
    startBtn: el.querySelector('.start'), stopBtn: el.querySelector('.stop'), rmBtn: el.querySelector('.rm'),
    labelEl: el.querySelector('.card-label'), placeholderEl: el.querySelector('.placeholder'),
    stageEl: el.querySelector('.stage'), stateEl: el.querySelector('.state'), pctEl: el.querySelector('.pct'),
    expBadge: el.querySelector('.exp-badge'), wbBadge: el.querySelector('.wb-badge'), audBadge: el.querySelector('.aud-badge'),
    outlierEl: el.querySelector('.outlier'),
    running: false,
    // detection state
    ref:null, prevGray:null, stillMs:0, fracA:null, movA:null, baseFlick:null,
    on:false, reason:null, badSince:null, goodSince:null, onSince:0, _t:null,
    // audio state
    silenceMs:0, lastAudioT:0,
    // QC state
    qcStab: window.QCStabilizer ? new window.QCStabilizer() : null, lastQCAt:0, lastQC:null,
  };
  cards.set(feedKey, card);

  if(initial){ card.courtIdInput.value = initial.courtId||''; card.urlInput.value = initial.url||''; }
  updateCardLabel(card);

  const setState = (txt,bad) => { card.stateEl.textContent=txt; card.stateEl.className='st '+(bad?'bad':'ok');
    card.stageEl.classList.toggle('alert', !!bad); };

  card.startBtn.onclick = () => {
    const u = card.urlInput.value.trim(); if(!u) return;
    card.ref=null; card.prevGray=null; card.stillMs=0; card.fracA=card.movA=card.baseFlick=null;
    card.on=false; card.reason=null; card.lastQC=null;
    card.placeholderEl.style.display='none'; setState('CONNECTING…', false);
    window.ingestAPI.start(feedKey, u);
    card.running=true; card.startBtn.disabled=true; card.stopBtn.disabled=false;
    card.courtIdInput.disabled=true; card.urlInput.disabled=true;
    saveConfig();
  };
  card.stopBtn.onclick = () => {
    window.ingestAPI.stop(feedKey);
    card.running=false; card.startBtn.disabled=false; card.stopBtn.disabled=true;
    card.courtIdInput.disabled=false; card.urlInput.disabled=false;
    card.placeholderEl.textContent='not started'; card.placeholderEl.style.display='flex';
    setState('STOPPED', false);
  };
  card.rmBtn.onclick = () => {
    if(card.running) window.ingestAPI.stop(feedKey);
    cards.delete(feedKey); el.remove(); saveConfig();
  };
  card.courtIdInput.oninput = () => { updateCardLabel(card); saveConfig(); };
  card.urlInput.oninput = saveConfig;

  card.drawFrame = ({w,h,buf,frozenMs}) => {
    const arr = new Uint8ClampedArray(buf.buffer||buf);
    cx.putImageData(new ImageData(arr,w,h),0,0);
    ox.drawImage(cv,0,0,PW,PH);
    analyseCard(card, ox.getImageData(0,0,PW,PH).data, frozenMs||0, setState);
    const now=performance.now();
    if(now-card.lastQCAt>700){ card.lastQCAt=now; runQCCard(card, arr, w, h); }
  };
  card.onAudio = a => onAudioCard(card, a);
  card.onStatus = d => { if(d.state==='NO FRAMES') setState('NO FRAMES', true); };

  return card;
}

function analyseCard(card, data, frozenMs, setState){
  const N=PW*PH; const gray=new Float32Array(N);
  for(let i=0,j=0;i<N;i++,j+=4) gray[i]=0.299*data[j]+0.587*data[j+1]+0.114*data[j+2];
  const cols=24, rows=Math.round(cols*PH/PW), nB=cols*rows;
  const sum=new Float32Array(nB), cnt=new Int32Array(nB);
  let lumaSum=0, moved=0, tot=0;
  for(let y=0;y<PH;y++){ const by=Math.min(rows-1,(y*rows/PH)|0);
    for(let x=0;x<PW;x++){ const idx=y*PW+x, g=gray[idx];
      sum[by*cols+Math.min(cols-1,(x*cols/PW)|0)]+=g; cnt[by*cols+Math.min(cols-1,(x*cols/PW)|0)]++;
      lumaSum+=g; if(card.prevGray){ if(Math.abs(g-card.prevGray[idx])>2) moved++; tot++; } } }
  const luma=lumaSum/N, moving=tot?moved/tot:1;
  const cur=new Float32Array(nB); for(let b=0;b<nB;b++) cur[b]=cnt[b]?sum[b]/cnt[b]:0;
  let frac=0;
  if(!card.ref||card.ref.length!==nB){ card.ref=cur; } else {
    let changed=0; for(let b=0;b<nB;b++){ if(Math.abs(cur[b]-card.ref[b])>18) changed++; if(!card.on) card.ref[b]+=0.04*(cur[b]-card.ref[b]); }
    frac=changed/nB;
  }
  if(!card.prevGray) card.prevGray=new Float32Array(N); card.prevGray.set(gray);
  card.fracA = card.fracA==null?frac:card.fracA+0.4*(frac-card.fracA);
  card.movA = card.movA==null?moving:card.movA+0.4*(moving-card.movA);
  const now=performance.now(), dt=now-(card._t||now); card._t=now;
  const base=card.baseFlick??card.movA??0.01, thr=Math.max(0.0004,base*0.2);
  if(card.movA<thr) card.stillMs+=dt; else card.stillMs=0;
  if(!card.on && card.movA>thr*2) card.baseFlick=card.baseFlick==null?card.movA:card.baseFlick+0.01*(card.movA-card.baseFlick);
  let raw=null;
  if(luma<16) raw='NO SIGNAL'; else if(frozenMs>1500) raw='FROZEN'; else if(card.fracA>=0.45) raw='CHANGE';
  if(raw){ card.badSince=card.badSince??now; card.goodSince=null; } else { card.goodSince=card.goodSince??now; card.badSince=null; }
  if(!card.on && raw && now-card.badSince>=250){ card.on=true; card.reason=raw; card.onSince=now; }
  else if(card.on && raw && raw!==card.reason && now-card.badSince>=250){ card.reason=raw; }
  else if(card.on && !raw && card.goodSince && now-card.goodSince>=600 && now-card.onSince>=1500){ card.on=false; card.reason=null; }
  card.pctEl.textContent = Math.round((card.fracA||0)*100);
  setState(card.on?card.reason:'LIVE', card.on);
}

function badge(el, v){ el.textContent = el.dataset.prefix + ' ' + v;
  el.className = 'badge ' + (v==='PASS'?'pass':v==='CHECK'?'check':v==='FAIL'?'fail':'na'); }

function runQCCard(card, arr, w, h){
  let q = window.analyseQC(arr, w, h);
  if(card.qcStab){ const s=card.qcStab.push(q); q={ exp:s.exp, wb:s.wb, verdict:s.verdict }; }
  card.expBadge.dataset.prefix='EXP'; card.wbBadge.dataset.prefix='WB';
  badge(card.expBadge, q.verdict.exposure); badge(card.wbBadge, q.verdict.whiteBalance);
  card.lastQC = { exp:q.exp, wb:q.wb };
  refreshConsistency();
}

function onAudioCard(card, a){
  const now=performance.now(), dt=card.lastAudioT?now-card.lastAudioT:0; card.lastAudioT=now;
  const rms=(a.momentary==null?-120:a.momentary), peak=(a.peak==null?-120:a.peak), ch=a.channels||[];
  if(rms<-55) card.silenceMs+=dt; else card.silenceMs=0;
  const dead = ch.length>=2 && (Math.max(...ch)-Math.min(...ch))>25 && Math.min(...ch)<-55;
  let state='PASS';
  if(card.silenceMs>1500) state='FAIL';
  else if(peak>-1) state='FAIL';
  else if(dead) state='FAIL';
  else if(rms<-40) state='CHECK';
  card.audBadge.dataset.prefix='AUD'; badge(card.audBadge, state);
}

// cross-court QC consistency (qc.js: flags courts >20pp from the group median)
function refreshConsistency(){
  const items = [...cards.values()].filter(c=>c.lastQC).map(c=>({ court:c.feedKey, exp:c.lastQC.exp, wb:c.lastQC.wb }));
  const out = window.consistency ? window.consistency(items) : {};
  cards.forEach(c => { const r = out[c.feedKey]; c.outlierEl.style.display = (r && r.outlier) ? 'inline-block' : 'none'; });
}

if(window.ingestAPI){
  window.ingestAPI.onFrame(d => { const c=cards.get(d.courtId); if(c) c.drawFrame(d); });
  window.ingestAPI.onAudio(d => { const c=cards.get(d.courtId); if(c) c.onAudio(d); });
  window.ingestAPI.onStatus(d => { const c=cards.get(d.courtId); if(c) c.onStatus(d); });
}

document.getElementById('add-card').onclick = () => { addCard(); saveConfig(); };

// restore saved courts (not auto-started — press Start per court)
(async () => {
  if(!window.configStore) { addCard(); return; }
  const cfg = await window.configStore.get();
  const courts = (cfg.ingestGrid && cfg.ingestGrid.courts) || [];
  if(courts.length) courts.forEach(addCard); else addCard();
})();
</script>
